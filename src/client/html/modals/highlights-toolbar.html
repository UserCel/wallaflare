<!-- Floating Highlight Toolbar (Desktop) -->
  <div id="readerHighlightToolbar" class="highlight-toolbar" style="display: none;" onmousedown="event.preventDefault()">
    <button class="hl-color-btn hl-yellow" onmousedown="event.preventDefault()" onclick="handleCreateHighlight('yellow')" title="Yellow Highlight"></button>
    <button class="hl-color-btn hl-green" onmousedown="event.preventDefault()" onclick="handleCreateHighlight('green')" title="Green Highlight"></button>
    <button class="hl-color-btn hl-blue" onmousedown="event.preventDefault()" onclick="handleCreateHighlight('blue')" title="Blue Highlight"></button>
    <button class="hl-color-btn hl-purple" onmousedown="event.preventDefault()" onclick="handleCreateHighlight('purple')" title="Purple Highlight"></button>
    <div class="hl-divider"></div>
    <button class="hl-btn" onmousedown="event.preventDefault()" onclick="handleCreateHighlightWithNote()" title="Highlight with Note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
      <span>Note</span>
    </button>
    <button class="hl-btn" onmousedown="event.preventDefault()" onclick="handleCopySelection()" title="Copy Selection">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      <span>Copy</span>
    </button>
  </div>

  <!-- Highlight Popover -->
  <div id="highlightPopover" class="highlight-popover" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
      <div style="display: flex; gap: 0.35rem; align-items: center;" id="popoverColors">
        <button class="hl-color-btn hl-yellow" onclick="changePopoverHighlightColor('yellow')" title="Yellow"></button>
        <button class="hl-color-btn hl-green" onclick="changePopoverHighlightColor('green')" title="Green"></button>
        <button class="hl-color-btn hl-blue" onclick="changePopoverHighlightColor('blue')" title="Blue"></button>
        <button class="hl-color-btn hl-purple" onclick="changePopoverHighlightColor('purple')" title="Purple"></button>
      </div>
      <div style="display: flex; gap: 0.25rem; align-items: center;">
        <button class="btn-icon" onclick="copyPopoverQuote()" title="Copy Quote" style="padding: 3px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <button class="btn-icon" onclick="deletePopoverHighlight()" title="Delete Highlight" style="color: var(--danger); padding: 3px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </div>
    <div id="popoverQuoteText" style="font-size: 0.78rem; font-style: italic; color: var(--text-secondary); max-height: 55px; overflow-y: auto; text-overflow: ellipsis; margin-bottom: 0.4rem; line-height: 1.35; word-break: break-word;"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.4rem; margin-bottom: 0.45rem; padding: 2px 6px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.75rem;">
      <div style="display: flex; align-items: center; gap: 2px;">
        <span style="color: var(--text-muted); font-size: 0.7rem; margin-right: 2px;">Start:</span>
        <button type="button" class="btn btn-outline" style="padding: 1px 5px; font-size: 0.72rem; line-height: 1.2;" onclick="adjustPopoverSelection('start', 'expand')" title="Expand start by one word">+W</button>
        <button type="button" class="btn btn-outline" style="padding: 1px 5px; font-size: 0.72rem; line-height: 1.2;" onclick="adjustPopoverSelection('start', 'shrink')" title="Shrink start by one word">-W</button>
      </div>
      <div style="display: flex; align-items: center; gap: 2px;">
        <span style="color: var(--text-muted); font-size: 0.7rem; margin-right: 2px;">End:</span>
        <button type="button" class="btn btn-outline" style="padding: 1px 5px; font-size: 0.72rem; line-height: 1.2;" onclick="adjustPopoverSelection('end', 'shrink')" title="Shrink end by one word">-W</button>
        <button type="button" class="btn btn-outline" style="padding: 1px 5px; font-size: 0.72rem; line-height: 1.2;" onclick="adjustPopoverSelection('end', 'expand')" title="Expand end by one word">+W</button>
      </div>
    </div>
    <div id="popoverNoteText" style="color: var(--text-primary); margin-bottom: 0.45rem; font-size: 0.8rem; line-height: 1.35; max-height: 70px; overflow-y: auto; word-break: break-word; padding: 0.3rem 0.45rem; background: var(--bg-primary); border-radius: var(--radius-sm); border-left: 3px solid var(--accent); display: none;"></div>
    <div style="display: flex; justify-content: flex-end; gap: 0.4rem; border-top: 1px solid var(--border-color); padding-top: 0.4rem;">
      <button class="btn btn-outline" style="font-size: 0.75rem; padding: 2px 8px;" onclick="openAnnotationNoteModal()"><span id="popoverNoteActionLabel">Add Note</span></button>
      <button class="btn btn-secondary" style="font-size: 0.75rem; padding: 2px 8px;" onclick="closeHighlightPopover()">Close</button>
    </div>
  </div>
