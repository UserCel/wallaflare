<!-- Modal: New Personal Access Token Created -->
<div class="modal-backdrop" id="tokenDisplayModal" onclick="if(event.target === this) closeModal('tokenDisplayModal')" style="display: none; z-index: 100010;">
  <div class="modal" style="max-width: 480px; width: 92vw; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 class="modal-title" style="margin: 0; font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem;">
        <span>🔑 Personal Access Token</span>
      </h3>
      <button class="close-btn" onclick="closeModal('tokenDisplayModal')">&times;</button>
    </div>

    <div style="background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.35); color: #eab308; padding: 0.75rem 0.9rem; border-radius: var(--radius-sm); font-size: 0.82rem; line-height: 1.45;">
      <strong>⚠️ Copy this token now.</strong> It will never be shown again! You can paste this as your Access Token in the KOReader Wallabag Plugin or third-party apps.
    </div>

    <div>
      <label id="tokenDisplayLabel" style="font-weight: 600; color: var(--text-secondary); font-size: 0.78rem; text-transform: uppercase; margin-bottom: 0.35rem; display: block;">Token</label>
      <div style="display: flex; gap: 0.5rem; align-items: stretch;">
        <input type="text" id="tokenDisplayValue" class="input code-box" readonly style="flex: 1; font-size: 0.82rem; padding: 0.5rem 0.75rem; user-select: all; font-family: var(--font-reader-mono);" />
        <button type="button" id="copyTokenDisplayBtn" class="btn btn-primary" onclick="copyTokenDisplayValue(this)" style="padding: 0.5rem 1rem; font-size: 0.85rem; white-space: nowrap;">Copy</button>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 0.25rem;">
      <button type="button" class="btn btn-outline" onclick="closeModal('tokenDisplayModal')">Done</button>
    </div>
  </div>
</div>
