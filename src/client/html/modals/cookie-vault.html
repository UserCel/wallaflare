<!-- Modal: Add / Login Site Cookie -->
  <div class="modal-backdrop" id="siteCookieModal" onclick="if(event.target === this) closeModal('siteCookieModal')">
    <div class="modal" style="max-width: 480px; padding: 0; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; border-radius: var(--radius-lg); clip-path: inset(0 round var(--radius-lg)); -webkit-mask-image: -webkit-radial-gradient(white, black); mask-image: radial-gradient(white, black);">
      <div class="modal-header" style="padding: 1.15rem 1.35rem; border-bottom: 1px solid var(--border-color); flex-shrink: 0; border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-lg);">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span style="font-size: 1.25rem;">🔑</span>
          <h3 class="modal-title" id="siteCookieModalTitle">Log In to Site</h3>
        </div>
        <button type="button" class="close-btn" onclick="closeModal('siteCookieModal')">&times;</button>
      </div>
      <form onsubmit="handleSaveSiteCookieSubmit(event)" style="display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; padding: 1.15rem 1.35rem; flex: 1;">
        <div class="form-group">
          <label for="siteCookieDomainInput">Site Name or Domain *</label>
          <input type="text" id="siteCookieDomainInput" class="form-input" placeholder="e.g. medium.com or substack.com" required autocomplete="off" autocorrect="off" autocapitalize="none" />
        </div>
        <div class="form-group" id="siteCookieLoginActionWrap">
          <label>In-App Login (Android App)</label>
          <button type="button" class="btn btn-primary" id="siteCookieLaunchLoginBtn" onclick="launchInAppSiteLogin()" style="width: 100%; justify-content: center; padding: 0.65rem;">
            <span>🌐</span> Open In-App Browser to Log In
          </button>
          <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 0.35rem;">
            Opens the site in a secure native browser window so you can sign in with your credentials or Google SSO. Cookies will be captured automatically.
          </div>
        </div>
        <div class="form-group" id="siteCookieManualValueWrap">
          <label for="siteCookieValueInput">Cookie String (Optional / Manual)</label>
          <textarea id="siteCookieValueInput" class="form-input" rows="3" placeholder="e.g. session_id=...; connect.sid=..." style="font-family: monospace; font-size: 0.75rem;"></textarea>
          <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 0.25rem;">
            On desktop or browser extensions, paste the cookie header string manually.
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.4rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('siteCookieModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="siteCookieSaveSubmitBtn">Save Session</button>
        </div>
      </form>
    </div>
  </div>
