name = "wallaflare"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom domain configuration for example.com
routes = [
  { pattern = "wallaflare.example.com", custom_domain = true }
]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "wallaflare-db"
database_id = "local-wallaflare-db"
migrations_dir = "migrations"

[vars]
APP_NAME = "Wallaflare"
# Optional: Set a secret token for API access if desired
# AUTH_TOKEN = "your-secret-token"
