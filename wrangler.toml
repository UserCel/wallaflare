name = "wallaflare"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "wallaflare-db"
database_id = "local-wallaflare-db"
migrations_dir = "migrations"

[vars]
# Wallaflare instance configuration
APP_NAME = "Wallaflare"
# Optional: Set a shared access secret / password if you want to restrict API / Ingest access
# AUTH_TOKEN = "your-secret-token"
